<svg width="200" height="280" viewBox="0 0 200 280" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-26px)}}
      @keyframes spin{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}
      @keyframes shadowScale{0%,100%{transform:scaleX(1);opacity:.28}50%{transform:scaleX(.55);opacity:.08}}
      @keyframes sparkA{0%,100%{opacity:0;transform:translate(0,0)}50%{opacity:1;transform:translate(-5px,-17px)}}
      @keyframes sparkB{0%,100%{opacity:0;transform:translate(0,0)}50%{opacity:1;transform:translate(7px,-20px)}}
      @keyframes trail{0%,100%{opacity:0}40%,60%{opacity:.15}}
      .bg{animation:float 2.6s ease-in-out infinite;transform-origin:100px 138px}
      .sg{animation:spin 5s linear infinite;transform-origin:100px 138px}
      .sh{animation:shadowScale 2.6s ease-in-out infinite;transform-origin:100px 228px}
      .tr{animation:trail 2.6s ease-in-out infinite}
      .sa{animation:sparkA 2.6s ease-in-out infinite .3s;transform-origin:158px 95px}
      .sb{animation:sparkB 2.6s ease-in-out infinite .9s;transform-origin:40px 110px}
    </style>
    <radialGradient id="g" cx="38%" cy="35%" r="62%">
      <stop offset="0%" stop-color="#FFF3DC"/>
      <stop offset="60%" stop-color="#F0C060"/>
      <stop offset="100%" stop-color="#C07010"/>
    </radialGradient>
    <clipPath id="c"><circle cx="100" cy="138" r="72"/></clipPath>
  </defs>

  <!-- Shadow -->
  <ellipse class="sh" cx="100" cy="228" rx="52" ry="10" fill="#000"/>

  <!-- Trail rings -->
  <circle class="tr" cx="100" cy="155" r="68" fill="none" stroke="#FF5100" stroke-width="2.5"/>
  <circle class="tr" cx="100" cy="166" r="61" fill="none" stroke="#FF5100" stroke-width="1.2" opacity=".5"/>

  <!-- Ball -->
  <g class="bg">
    <circle cx="100" cy="138" r="72" fill="url(#g)" stroke="#C07010" stroke-width="1.8"/>
    <g clip-path="url(#c)" class="sg">
      <path d="M28 138 Q64 112 100 138 Q136 164 172 138" fill="none" stroke="#B03000" stroke-width="2.8" stroke-linecap="round"/>
      <path d="M50 76 Q68 108 66 138 Q64 168 50 200" fill="none" stroke="#B03000" stroke-width="2.8" stroke-linecap="round"/>
      <path d="M150 76 Q132 108 134 138 Q136 168 150 200" fill="none" stroke="#B03000" stroke-width="2.8" stroke-linecap="round"/>
      <line x1="100" y1="66" x2="100" y2="210" stroke="#1A6FA0" stroke-width="2.2" stroke-linecap="round" opacity=".75"/>
      <path d="M28 114 Q64 98 100 114 Q136 130 172 114" fill="none" stroke="#1A6FA0" stroke-width="1.4" stroke-linecap="round" opacity=".45"/>
      <path d="M28 162 Q64 178 100 162 Q136 146 172 162" fill="none" stroke="#1A6FA0" stroke-width="1.4" stroke-linecap="round" opacity=".45"/>
    </g>
    <ellipse cx="76" cy="112" rx="20" ry="13" fill="#fff" opacity=".42" transform="rotate(-25 76 112)"/>
    <circle cx="70" cy="107" r="6" fill="#fff" opacity=".22"/>
  </g>

  <!-- Star sparkles -->
  <g class="sa"><polygon points="158,95 161,89 164,95 170,95 165,99 167,105 161,101 155,105 157,99 152,95" fill="#FF6B00"/></g>
  <g class="sb"><polygon points="40,110 43,104 46,110 52,110 47,114 49,120 43,116 37,120 39,114 34,110" fill="#FFD700"/></g>

  <!-- Floating dots -->
  <circle cx="34" cy="96" r="3" fill="#FF5100">
    <animate attributeName="opacity" values="0;.9;0" dur="2.6s" begin=".2s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="96;76;96" dur="2.6s" begin=".2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="170" cy="120" r="2.5" fill="#FFD700">
    <animate attributeName="opacity" values="0;.9;0" dur="2.6s" begin="1.1s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="120;100;120" dur="2.6s" begin="1.1s" repeatCount="indefinite"/>
  </circle>
  <circle cx="26" cy="155" r="2" fill="#FFD700">
    <animate attributeName="opacity" values="0;.8;0" dur="2.6s" begin="1.7s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="155;138;155" dur="2.6s" begin="1.7s" repeatCount="indefinite"/>
  </circle>
</svg>
